name: rpg-dev

services:
  web:
    image: nginx:1.24-alpine          # matches hermes (nginx/1.24.0)
    ports:
      - "8081:80"          # 8080 is held by the llama-server container
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped

  php:
    build: ./docker/php               # php:8.4-fpm + prod's extension set
    volumes:
      - ./src:/var/www/html
    environment:
      # app/config/database.php reads all of these via getenv().
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: rpg_5e
      DB_USERNAME: web
      DB_PASSWORD: devpassword
      # Unity editor / local WebGL. Unset in production — a standalone
      # player does not enforce CORS, and the workshop is same-origin.
      RPG_CORS_ORIGINS: local
      # Where the dungeon generator lives. Unset it and MapService falls back to
      # the PHP generator, which is also what happens if the service is down —
      # so this is a preference, never a dependency.
      RPG_MAPGEN_URL: http://mapgen:8091
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # The dungeon generator, vendored from the TypeScript original.
  #
  # No `ports:` on purpose. It is reachable from php over the compose network
  # and from nowhere else, which is why it needs no authentication — see
  # docker/mapgen/src/server.mjs. Not in php's `depends_on` either: the game
  # generates its own dungeons when this is missing, and a hard dependency would
  # turn a nicer map into a reason the site will not start.
  mapgen:
    build: ./docker/mapgen
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: mysql:8.0                  # matches hermes (8.0.46)
    ports:
      - "3307:3306"                   # 3307 on the host to avoid clashing with any local mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootdev
      MYSQL_DATABASE: rpg_5e
      MYSQL_USER: web
      MYSQL_PASSWORD: devpassword
    volumes:
      - dbdata:/var/lib/mysql
      - ./src/sql:/sql:ro                        # the project's own SQL files
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootdev"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  dbdata:
