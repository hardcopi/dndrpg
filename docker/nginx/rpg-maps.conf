# http-level maps for the rpg vhost. A `map` cannot live inside a server block,
# so this is its own file: in docker it is mounted into /etc/nginx/conf.d/
# (included at http level, ahead of default.conf by name), and on hermes it is
# installed as /etc/nginx/conf.d/rpg-maps.conf. See docs/ops/HERMES_NGINX.md.

# Cache policy for stylesheets and scripts, keyed on the ?v= that asset()
# (src/app/bootstrap.php) appends: v is the file's mtime (style.css folds in
# tokens.css's), so a changed file is a new URL and the old one can be cached
# for good. A request with no ?v= — tokens.css, pulled in by a relative
# @import, the /embed/ loader, a hand-typed URL — keeps `no-cache`
# (revalidate with the ETag every time), which is the policy all CSS/JS had
# before.
map $arg_v $rpg_asset_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}
