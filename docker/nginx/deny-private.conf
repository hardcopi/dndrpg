# Paths under the web root that are not the site, answered 404.
#
# Included at SERVER level by docker/nginx/default.conf, and installed on hermes
# as /etc/nginx/snippets/rpg-deny-private.conf, included from the rpg vhost's
# server block the same way. Keep the two identical — this file is the copy
# that is reviewed.
#
# rsync-excludes stops deploy.sh sending these. This is the second fence: for
# what earlier deploys already put on hermes (sql/content.sql, docs/*.md and
# tools/*.py were all downloadable), for whatever a future deploy lets slip,
# and for content/, which DOES have to be on disk because ContentEditor and
# ContentExporter write content/**/*.json under APP_ROOT at runtime, but has
# no business being served.
#
# Why `if` at server level rather than `location` blocks. A `location ^~`
# prefix match stops nginx looking at regex locations at all, and default.conf
# has `location ^~ /embed/` — so a regex location for `\.md$` would never see
# /embed/README.md, however early it was placed. Server-level rewrite
# directives run before ANY location is chosen, and again after every internal
# redirect, so these hold under every location block present or future and
# their order against `location ~ \.php$` does not matter: /sql/index.php and
# /tools/*.php are refused before PHP is considered. `if` + `return` is the use
# of `if` nginx documents as safe.
#
# $uri is the decoded, normalised path (no query string, %-escapes and `..`
# already resolved), so /%73ql/ and /assets/../sql/ are caught as /sql/.
#
# The body is given explicitly so error_page 404 does not take over and serve
# the homepage via try_files with a 404 status on it.

# Whole directories. `(/|$)` so /content.php — the editors — is NOT matched.
if ($uri ~ "^/(sql|tools|docs|content|tests)(/|$)") {
    return 404 "not found\n";
}

# Dotfiles and dot-directories at any depth (.git, .gitignore, .claude/, .env),
# except /.well-known/ AT THE ROOT, which certbot answers ACME challenges from.
# The lookahead is anchored at the start of the path, so only that one
# top-level directory is exempt: /embed/.well-known/x is refused. The second
# alternative refuses a dotfile INSIDE it (/.well-known/.htpasswd) as well —
# the exemption is for the directory, not for what is dot-named beneath it.
if ($uri ~ "^(?!/\.well-known/).*/\.|^/\.well-known(/.*)?/\.") {
    return 404 "not found\n";
}

# Source, notes, scripts and editor droppings, wherever they are. Not `.txt`:
# assets/fonts/**/OFL.txt are licences that travel with the fonts.
if ($uri ~* "\.(sql|md|py|pyc|sh|log|bak|orig|swp)$") {
    return 404 "not found\n";
}

# Scratch output from verification runs, left at the top of the root.
if ($uri ~ "^/verify(_db)?\.txt$") {
    return 404 "not found\n";
}
