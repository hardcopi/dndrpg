server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.html index.htm index.php;

    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Missing art must 404, not fall through to the homepage. The vhost's
    # try_files ends at index.php, so a typo in a sprite path used to return
    # 200 text/html — invisible to a status-only check, and a corrupt
    # texture to Unity. Named location so error_page 404 /404.html cannot
    # turn around and serve the homepage as the 404 body.
    location /assets/ {
        try_files $uri @asset_missing;
    }
    location @asset_missing {
        default_type text/plain;
        return 404 "not found\n";
    }

    # Equivalent of Debian's snippets/fastcgi-php.conf, which hermes includes.
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $fastcgi_script_name =404;
        set $path_info $fastcgi_path_info;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_index index.php;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Unity (and some proxies) send Authorization; PHP-FPM only sees it
        # when it is passed through. Without this, Bearer tokens vanish.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # Stylesheets and scripts must never be served stale. Mirrors the block
    # added to hermes:/etc/nginx/sites-available/rpg — this stack exists to
    # match production, and a caching rule that differs between them is a
    # class of bug you can only meet in the place you cannot debug.
    #
    # The pages link style.css as ?v=<mtime>, but style.css pulls tokens.css in
    # with `@import url(tokens.css)`, and a relative @import resolves without
    # the query string — so that file has no versioned URL and nothing else can
    # invalidate it. With no Cache-Control a browser falls back to heuristic
    # freshness, roughly a tenth of the file age, which is how the first deploy
    # of the rebuilt interface went out and returning browsers went on painting
    # it with July's stylesheet for a day.
    #
    # `no-cache` means keep it but ask before using it; the ETag is already
    # sent, so the ask is a 304 with an empty body.
    #
    # Deliberately NOT images: 275MB of art on stable filenames, for which
    # heuristic caching is right.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache" always;
    }

    # The character embed: a Unity WebGL player and its part bundles, dropped
    # in whole by rpg-unity/build-embed.sh. `^~` so this wins over the
    # `\.(css|js)$` regex below — the player's loader is a .js file and must not
    # be told never to cache, because it is the smallest file in a 30 MB set
    # that all shares its lifetime.
    location ^~ /embed/ {
        # Unity asks for `Build/name.wasm.br` by that exact name. The server has
        # to say what the bytes underneath the compression are, because the
        # browser is going to hand them to the WebAssembly compiler and not to a
        # download dialog. gzip off, or nginx re-compresses an already
        # compressed file and the loader gets something it cannot read.
        gzip off;

        # Everything here revalidates. Unity's WebGL output does NOT carry a
        # content hash in its filenames — every build writes the same
        # `embed.wasm.unityweb` — so there is no such thing as an immutable URL
        # under this path. Marking them immutable, which is what this block did
        # first, means a rebuilt embed is invisible until the browser feels like
        # asking again: the player boots, loads yesterday's WebAssembly, and
        # shows a version of the creator that no longer exists on disk.
        #
        # `no-cache` is not "do not cache" — it is "keep it, but ask first". The
        # ETag is already sent, so the ask is a 304 with an empty body and the
        # second visit still costs nothing but a round trip.
        add_header Cache-Control "no-cache" always;

        location ~ \.wasm\.br$ {
            add_header Content-Encoding br;
            add_header Cache-Control "no-cache" always;
            default_type application/wasm;
        }
        location ~ \.js\.br$ {
            add_header Content-Encoding br;
            add_header Cache-Control "no-cache" always;
            default_type application/javascript;
        }
        location ~ \.(?:data|symbols\.json)\.br$ {
            add_header Content-Encoding br;
            add_header Cache-Control "no-cache" always;
            default_type application/octet-stream;
        }
        location ~ \.wasm\.gz$ {
            add_header Content-Encoding gzip;
            add_header Cache-Control "no-cache" always;
            default_type application/wasm;
        }
        location ~ \.js\.gz$ {
            add_header Content-Encoding gzip;
            add_header Cache-Control "no-cache" always;
            default_type application/javascript;
        }
        location ~ \.(?:data|symbols\.json)\.gz$ {
            add_header Content-Encoding gzip;
            add_header Cache-Control "no-cache" always;
            default_type application/octet-stream;
        }

        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
