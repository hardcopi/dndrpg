server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.html index.htm index.php;

    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Equivalent of Debian's snippets/fastcgi-php.conf, which hermes includes.
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $fastcgi_script_name =404;
        set $path_info $fastcgi_path_info;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_index index.php;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Stylesheets and scripts must never be served stale. Mirrors the block
    # added to hermes:/etc/nginx/sites-available/rpg — this stack exists to
    # match production, and a caching rule that differs between them is a
    # class of bug you can only meet in the place you cannot debug.
    #
    # The pages link style.css as ?v=<mtime>, but style.css pulls tokens.css in
    # with `@import url(tokens.css)`, and a relative @import resolves without
    # the query string — so that file has no versioned URL and nothing else can
    # invalidate it. With no Cache-Control a browser falls back to heuristic
    # freshness, roughly a tenth of the file age, which is how the first deploy
    # of the rebuilt interface went out and returning browsers went on painting
    # it with July's stylesheet for a day.
    #
    # `no-cache` means keep it but ask before using it; the ETag is already
    # sent, so the ask is a 304 with an empty body.
    #
    # Deliberately NOT images: 275MB of art on stable filenames, for which
    # heuristic caching is right.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
