# Compression and asset caching for the rpg vhost, at SERVER level.
#
# Included by docker/nginx/default.conf, and to be installed on hermes as
# /etc/nginx/snippets/rpg-perf.conf, included from the rpg vhost's server block
# next to rpg-deny-private.conf. Keep the two identical; this is the reviewed
# copy. The map it relies on ($rpg_asset_cache) is http-level and lives in
# docker/nginx/rpg-maps.conf. See docs/ops/HERMES_NGINX.md.
#
# Why: hermes gzipped HTML only (nginx's default gzip_types is text/html), so
# style.css (357 KB), ui-combat.js (127 KB) and the rest of ~1.6 MB of CSS and
# JS went out raw on every first visit, and so did every API JSON reply.
#
# Not images or audio: PNG/JPEG/WebP/MP3 are already compressed, and gzipping
# them costs CPU for nothing. /embed/ keeps its own `gzip off` (Unity ships
# pre-compressed .br/.gz files and must not be compressed twice).
# No streaming responses exist (no text/event-stream), so buffering for gzip is
# safe for /api/ too.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/css
    text/plain
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    font/ttf
    font/otf;
