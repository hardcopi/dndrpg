<!doctype html>
<meta charset="utf-8">
<title>HUD probe — measured layout</title>
<link rel="stylesheet" href="../assets/css/style.css">
<!--
  What the HUD actually measures, in a real browser.

  The game shell is a floating HUD over a full-bleed map, and its panels are
  sized by a chain of tokens (`--portrait`, `--hud-inset-*`) layered over card
  styles inherited from the three-column rail that came before. Reading the
  stylesheet is not enough to know what wins: two bugs here were found only by
  measuring, and neither was a specificity problem.

    * `.party-face` rendered at 145px inside a 38px card. An <img> is a
      *replaced* element, and an absolutely positioned replaced box with
      `width: auto` takes its intrinsic width — `inset` does not stretch it.

    * `.party-add` stayed 74px tall. `.party-add { min-height: 74px }` survived
      from the old rail, and a min-* floor is a different property from the
      `height` that was being set, so specificity never came into it.

  Both look correct in the source. Hence this page.

  `game.php` needs a session, so the party rail is built here from the same
  markup `renderPartyRail()` emits — the cascade under test is the real one
  because the ancestry and class names match.

  In a browser:
      http://localhost:8081/tools/hud_probe.html

  Headless, at the display's real scale (this is how it is usually run):
      google-chrome --headless --no-sandbox --disable-gpu \
        --force-device-scale-factor=1.5 --window-size=1280,720 \
        --virtual-time-budget=5000 --dump-dom \
        http://localhost:8081/tools/hud_probe.html \
        | sed -n '/<pre id="out"/,/<\/pre>/p' | sed 's/<[^>]*>//g'

  Set --force-device-scale-factor to whatever tools/dpr_check.html reports, or
  the numbers describe a display nobody has.
-->
<style>
  #out {
    position: fixed; inset: auto 0 0 0; z-index: 9999;
    max-height: 55vh; overflow: auto; margin: 0; padding: 10px 14px;
    background: #0b0d10; color: #cfe6cf; border-top: 1px solid #3a424e;
    font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap;
  }
  #out .bad { color: #ec8b8b; font-weight: 700; }
  #out .good { color: #7fdd93; }
</style>

<body class="game-page">
<div class="game-shell">
  <div class="map-frame">
    <div class="map-stage" id="map-area"></div>
    <!-- Hidden; un-hidden only for the combat-overlap measurement. -->
    <div class="combat-screen hidden" id="combat-root">
      <div class="cbt-ribbon"></div>
      <div class="cbt-field"></div>
      <div class="cbt-bar" id="cbt-bar">
        <div class="cbt-economy"><span class="econ">Action</span></div>
        <div class="cbt-actions"><button class="btn">Attack</button><button class="btn">Defend</button></div>
      </div>
    </div>
  </div>
  <div class="hud">
    <aside class="hud-party" id="party-rail" aria-label="Party"></aside>
    <div class="hud-top topbar">
      <div class="topbar-actions hud-icons" role="toolbar" aria-label="Menu">
        <button type="button" class="icon-btn"><svg aria-hidden="true"><use href="#i-journal"></use></svg></button>
        <button type="button" class="icon-btn"><svg aria-hidden="true"><use href="#i-camp"></use></svg></button>
      </div>
    </div>
    <div class="hud-place">
      <div class="map-name" id="map-name">Rivermark</div>
      <div class="meta" id="map-desc">desc</div>
      <div class="meta" id="pos-meta">12, 8</div>
    </div>
    <div class="hud-minimap" id="hud-minimap">
      <div class="minimap-wrap"><canvas id="minimap-canvas" width="200" height="160"></canvas></div>
      <div class="help-hint" id="minimap-label">Rivermark</div>
    </div>
    <section class="hud-quest quest-tracker"><h2>Tracking</h2><div class="track-title">A quest</div></section>
    <div class="hud-log" id="hud-log">
      <div class="hud-log-head">
        <div class="log-filters"><button class="chip on">All</button></div>
      </div>
      <div class="log" id="game-log"><div class="line">a log line</div></div>
    </div>
    <div class="hud-actions action-bar" id="action-bar" role="toolbar">
      <button class="btn action-btn">Talk</button>
    </div>
  </div>
</div>

<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <symbol id="i-journal" viewBox="0 0 24 24"><path d="M5 4h11a2 2 0 012 2v14H7a2 2 0 01-2-2z"/></symbol>
  <symbol id="i-camp" viewBox="0 0 24 24"><path d="M12 4L4 19h16z"/></symbol>
</svg>

<pre id="out">measuring…</pre>

<script>
(function () {
  const rail = document.getElementById('party-rail');

  // Fixtures: exactly what renderPartyRail() builds, so the selectors under
  // test match the same way they do in the game.
  for (let i = 0; i < 3; i++) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'party-card hp-ok' + (i === 0 ? ' is-active' : '');
    card.style.setProperty('--hp', '0.72');
    card.innerHTML =
      '<img class="party-face" src="../assets/images/npcs/aldric_face.png" alt="">'
      + '<div class="party-name">Someone</div>'
      + '<div class="hp-bar"><span class="ok" style="width:72%"></span></div>'
      + '<div class="party-stats"><span class="party-hp">9/12</span></div>'
      + '<div class="cond-pips"></div>';
    rail.appendChild(card);
  }
  const add = document.createElement('a');
  add.className = 'party-card party-add';
  add.href = '#';
  add.title = 'Recruit a companion';
  add.innerHTML = '<span class="party-add-plus">+</span><span>Recruit</span>';
  rail.appendChild(add);

  /**
   * Specificity of a single compound selector, as [ids, classes, elements].
   *
   * Deliberately not a full Selectors-4 implementation — it exists to rank
   * rules that already match one element, where counting the three buckets is
   * enough. An earlier version of this returned whichever matching rule came
   * last in the file, which is only right at equal specificity and named the
   * wrong winner both times it was consulted.
   */
  function specificity(sel) {
    const s = sel.replace(/\s*[>+~]\s*/g, ' ');
    const ids = (s.match(/#[\w-]+/g) || []).length;
    const cls = (s.match(/\.[\w-]+|\[[^\]]+\]|:(?!:)(?!not\b)[\w-]+/g) || []).length;
    const el = (s.match(/(^|\s)[a-zA-Z][\w-]*/g) || []).length
             + (s.match(/::[\w-]+/g) || []).length;
    return [ids, cls, el];
  }
  const cmp = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];

  /** Which rule actually sets `prop` on `el`, and every rule it beat. */
  function winner(el, prop) {
    const hits = [];
    for (const sheet of document.styleSheets) {
      let rules;
      try { rules = sheet.cssRules; } catch (e) { continue; }   // cross-origin
      for (const r of rules) {
        if (!r.selectorText || !r.style) continue;
        const v = r.style.getPropertyValue(prop);
        if (!v) continue;
        // A rule's selector list may match on any one of its selectors.
        for (const sel of r.selectorText.split(',')) {
          let matches = false;
          try { matches = el.matches(sel.trim()); } catch (e) { continue; }
          if (!matches) continue;
          hits.push({
            sel: sel.trim(), value: v,
            important: r.style.getPropertyPriority(prop) === 'important',
            spec: specificity(sel.trim()),
          });
          break;
        }
      }
    }
    if (!hits.length) return null;
    // Later wins at equal specificity; !important beats everything below it.
    let best = hits[0];
    for (const h of hits) {
      if (h.important !== best.important) { if (h.important) best = h; continue; }
      if (cmp(h.spec, best.spec) >= 0) best = h;
    }
    return {
      won: `${best.sel} { ${prop}: ${best.value}${best.important ? ' !important' : ''} }`,
      alsoMatched: hits.filter((h) => h !== best).map((h) => `${h.sel} → ${h.value}`),
    };
  }

  const box = (el) => {
    const r = el.getBoundingClientRect();
    return Math.round(r.width) + '×' + Math.round(r.height);
  };

  addEventListener('load', () => {
    const root = getComputedStyle(document.documentElement);
    const token = (n) => root.getPropertyValue(n).trim();
    const portrait = parseFloat(token('--portrait'));
    const out = [];
    const checks = [];

    out.push('=== display ===');
    out.push(`  devicePixelRatio  ${devicePixelRatio}`);
    out.push(`  logical viewport  ${innerWidth}×${innerHeight}`);
    out.push(`  device pixels     ${Math.round(innerWidth * devicePixelRatio)}×${Math.round(innerHeight * devicePixelRatio)}`);

    out.push('\n=== tokens ===');
    for (const n of ['--portrait', '--hud-inset-left', '--hud-inset-right',
                     '--hud-inset-top', '--hud-inset-bottom']) {
      const v = token(n);
      out.push(`  ${n.padEnd(20)} ${v || '(UNSET)'}`);
      if (!v) checks.push(`${n} is unset — anything using var(${n}) falls back to its initial value`);
    }

    out.push('\n=== HUD panels (measured) ===');
    document.querySelectorAll('.hud > *').forEach((el) => {
      out.push(`  ${('.' + el.className.trim().replace(/\s+/g, '.')).padEnd(30)} ${box(el)}`);
    });

    out.push('\n=== party rail children ===');
    // A card is the portrait square plus its HP bar, so it is taller than
    // --portrait; the recruit slot is a bare circle and is not.
    const cardH = parseFloat(getComputedStyle(rail.querySelector('.party-card')).height);
    [...rail.children].forEach((el) => {
      const b = el.getBoundingClientRect();
      const want = el.classList.contains('party-add') ? portrait : cardH;
      const ok = Math.abs(b.width - portrait) < 1 && Math.abs(b.height - want) < 1;
      out.push(`  ${('.' + el.className.trim().replace(/\s+/g, '.')).padEnd(34)} ${box(el)} ${ok ? '' : '  <-- expected ' + portrait + '×' + want}`);
      if (!ok) checks.push(`${el.className} is ${box(el)}, expected ${portrait}×${want}`);
    });

    // The HP bar must sit under the portrait, inside the card, and span it.
    const bar = rail.querySelector('.party-card .hp-bar');
    if (!bar) {
      checks.push('no .hp-bar inside a party card — the HUD is hiding it again');
    } else {
      const cb = rail.querySelector('.party-card').getBoundingClientRect();
      const bb = bar.getBoundingClientRect();
      const fill = bar.querySelector('span');
      out.push(`  ${'  .hp-bar'.padEnd(34)} ${box(bar)}  fill ${fill ? Math.round(fill.getBoundingClientRect().width) + 'px' : '(none)'}`
        + `  bandColour ${fill ? getComputedStyle(fill).backgroundImage.slice(0, 28) + '…' : '-'}`);
      if (bb.width < 1 || bb.height < 1) checks.push('.hp-bar has no size — a later rule is collapsing it');
      if (bb.bottom > cb.bottom + 1) checks.push('.hp-bar overflows the bottom of its card');
      if (bb.top < cb.top + portrait - 1) checks.push('.hp-bar overlaps the portrait rather than sitting under it');
    }

    const face = rail.querySelector('.party-face');
    const fb = face.getBoundingClientRect();
    out.push(`  ${'  .party-face (inside a card)'.padEnd(34)} ${box(face)}  natural ${face.naturalWidth}×${face.naturalHeight}`);
    if (fb.width > portrait) {
      checks.push('.party-face is wider than the card — an absolutely positioned '
        + '<img> with width:auto takes its intrinsic size; give it explicit dimensions');
    }

    // The invariant most likely to break silently: the HUD floats over the map,
    // and the whole interaction model is clicking tiles. A container that
    // stretches to its grid column (or a panel's transparent padding) will
    // happily eat clicks while looking like empty air. Sample a grid of points
    // and report anything that is neither the map nor a real control.
    out.push('\n=== click-through (does the map still receive clicks?) ===');
    const CONTROLS = ['.hud-icons', '.hud-minimap', '.hud-quest', '.hud-log',
                      '.party-card', '.party-add', '.action-btn', '.icon-btn', '.chip'];
    const blockers = new Map();
    let sampled = 0, reachedMap = 0;
    for (let gx = 0; gx <= 20; gx++) {
      for (let gy = 0; gy <= 14; gy++) {
        const x = (gx / 20) * (innerWidth - 2) + 1;
        const y = (gy / 14) * (innerHeight - 2) + 1;
        const hit = document.elementFromPoint(x, y);
        if (!hit) continue;
        if (hit.closest('#out')) continue;   // this page's own readout; not in the game
        sampled++;
        if (hit.closest('.map-frame')) { reachedMap++; continue; }
        if (CONTROLS.some((c) => hit.closest(c))) continue;   // a real control
        const key = '.' + (hit.className || hit.tagName).toString().trim().replace(/\s+/g, '.');
        blockers.set(key, (blockers.get(key) || 0) + 1);
      }
    }
    out.push(`  ${reachedMap}/${sampled} sample points reach the map`);
    if (blockers.size) {
      [...blockers].sort((a, b) => b[1] - a[1]).forEach(([k, n]) =>
        out.push(`    blocked by ${k} at ${n} point(s)`));
      checks.push(`${[...blockers.values()].reduce((a, b) => a + b, 0)} sample point(s) `
        + 'blocked by non-control HUD boxes — those areas of the map are unclickable');
    }

    // Combat draws its own bar across the bottom of the board, under the HUD's
    // z-index, so the log floats over it. Check the bar actually starts clear of
    // the log rather than trusting the arithmetic. Done after the click-through
    // sweep so un-hiding the board does not skew it.
    out.push('\n=== combat bar vs the log ===');
    const combat = document.getElementById('combat-root');
    combat.classList.remove('hidden');
    document.body.classList.add('in-combat');
    const barEl = document.getElementById('cbt-bar');
    const logEl = document.getElementById('hud-log');
    const br = barEl.getBoundingClientRect();
    const lr = logEl.getBoundingClientRect();
    const overlapX = Math.min(br.right, lr.right) - Math.max(br.left, lr.left);
    const overlapY = Math.min(br.bottom, lr.bottom) - Math.max(br.top, lr.top);
    out.push(`  log      left ${Math.round(lr.left)} right ${Math.round(lr.right)}  top ${Math.round(lr.top)} bottom ${Math.round(lr.bottom)}`);
    out.push(`  cbt-bar  left ${Math.round(br.left)} right ${Math.round(br.right)}  top ${Math.round(br.top)} bottom ${Math.round(br.bottom)}`);
    if (overlapX > 0 && overlapY > 0) {
      out.push(`  OVERLAP ${Math.round(overlapX)}×${Math.round(overlapY)}px`);
      checks.push(`the log overlaps the combat bar by ${Math.round(overlapX)}×${Math.round(overlapY)}px `
        + '— combat buttons are covered');
    } else {
      out.push('  clear — no overlap');
    }
    combat.classList.add('hidden');
    document.body.classList.remove('in-combat');

    out.push('\n=== who wins ===');
    for (const [sel, prop] of [['.party-card', 'width'], ['.party-card', 'height'],
                               ['.party-face', 'width'], ['.party-face', 'position'],
                               ['.party-add', 'height'], ['.party-add', 'min-height']]) {
      const el = rail.querySelector(sel);
      if (!el) continue;
      const w = winner(el, prop);
      out.push(`  ${sel} ${prop}:`);
      out.push(`      won  ${w ? w.won : '(no rule sets it)'}`);
      (w ? w.alsoMatched : []).forEach((m) => out.push(`      lost ${m}`));
    }

    out.push('\n=== verdict ===');
    if (checks.length) {
      out.push(...checks.map((c) => `  FAIL  ${c}`));
    } else {
      out.push('  OK  every rail child matches --portrait, and no panel is oversized.');
    }

    const pre = document.getElementById('out');
    pre.textContent = out.join('\n');
    // Colour only when a human is looking; --dump-dom strips it out anyway.
    pre.innerHTML = pre.innerHTML
      .replace(/(FAIL.*)/g, '<span class="bad">$1</span>')
      .replace(/(OK  .*)/g, '<span class="good">$1</span>');
  });
})();
</script>
